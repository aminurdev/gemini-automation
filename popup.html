<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Bulk Image Generator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-box">
    <!-- Header -->
    <header class="popup-top">
      <div class="title-group">
        <div class="logo-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
          </svg>
        </div>
        <div class="title-text-wrap">
          <span class="app-name">Bulk Prompts</span>
        </div>
      </div>
      <div class="header-right">
        <button id="btn-theme-toggle" class="theme-icon-btn" title="Toggle Theme">🌙</button>
        <span class="ver-pill">v1.1</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="popup-content">
      <!-- Status & Power Toggle -->
      <div class="status-banner power-row">
        <div class="power-left">
          <span class="pulse-indicator" id="popup-status-dot"></span>
          <span class="status-label" id="popup-status-label">Automation Enabled</span>
        </div>
        <label class="popup-switch" title="Toggle Automation On / Off">
          <input type="checkbox" id="popup-power-toggle" checked>
          <span class="popup-slider"></span>
        </label>
      </div>

      <!-- Primary Action -->
      <button id="btn-open-gemini" class="open-btn">
        <span class="btn-text">Open Gemini Images</span>
        <svg class="btn-arrow" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="7" y1="17" x2="17" y2="7"></line>
          <polyline points="7 7 17 7 17 17"></polyline>
        </svg>
      </button>

      <!-- Minimal Stepper Overview -->
      <div class="workflow-card">
        <div class="pipeline-steps">
          <div class="step-item">
            <span class="step-num">1</span>
            <span class="step-text">Images Canvas</span>
          </div>
          <span class="step-divider">›</span>
          <div class="step-item">
            <span class="step-num">2</span>
            <span class="step-text">Queue Run</span>
          </div>
          <span class="step-divider">›</span>
          <div class="step-item">
            <span class="step-num">3</span>
            <span class="step-text">Auto-Save</span>
          </div>
        </div>
      </div>

      <!-- Micro Note -->
      <div class="quick-hints">
        <span>Widget docks directly on gemini.google.com</span>
      </div>
    </main>

    <!-- Footer -->
    <footer class="popup-footer">
      <span id="popup-footer-text">Ready to generate</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
