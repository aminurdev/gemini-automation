<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk Prompts for Gemini</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-box">
    <div class="popup-top">
      <div class="title-group">
        <span class="dot"></span>
        <span class="app-name">Bulk Prompts</span>
      </div>
      <div style="display:flex; align-items:center; gap:5px;">
        <button id="btn-theme-toggle" class="theme-icon-btn" title="Toggle Theme (Dark / Light)">🌙</button>
        <span class="ver">v1.0</span>
      </div>
    </div>

    <div class="popup-content">
      <p class="desc">Automate multi-prompt image generation and auto-download on Google Gemini.</p>

      <button id="btn-open-gemini" class="open-btn">
        <span>Open Gemini</span>
        <span>↗</span>
      </button>

      <div class="hints">
        <div class="hint-row">
          <span class="hint-bullet">1</span>
          <span>Open <b>gemini.google.com</b></span>
        </div>
        <div class="hint-row">
          <span class="hint-bullet">2</span>
          <span>Use the floating corner widget</span>
        </div>
        <div class="hint-row">
          <span class="hint-bullet">3</span>
          <span>Auto-generates & downloads images</span>
        </div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
